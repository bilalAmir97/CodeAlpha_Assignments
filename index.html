<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Photos Gallery - CodeAlpha Assignment</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Mobile Sidebar -->
  <div class="mobile-sidebar" id="mobileSidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Filters</div>
      <button class="sidebar-close" id="sidebarClose">×</button>
    </div>
    <div class="sidebar-filters">
      <button class="filter-btn mobile-filter active" data-filter="all">
        All Photos
      </button>
      <button class="filter-btn mobile-filter" data-filter="recent">
        📅 Recently Uploaded
      </button>
      <button class="filter-btn mobile-filter" data-filter="camera">
        📷 Camera Uploads
      </button>
      <button class="filter-btn mobile-filter" data-filter="documents">
        📄 Documents
      </button>
      <button class="filter-btn mobile-filter" data-filter="albums">
        📁 Albums
      </button>
    </div>
  </div>
  <div class="mobile-overlay" id="mobileOverlay"></div>

  <!-- Header -->
  <div class="header">
    <div style=" display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: wrap; gap: 24px;">
      <h1>📸 Photo Gallery - CodeAlpha Assignment</h1>
      <div class="upload-section">
        <input type="file" id="imageUpload" accept="image/*" multiple style="display: none" />
        <button class="upload-btn" id="uploadBtn">
          <span>📁 Choose Images</span>
        </button>
      </div>
    </div>
    <button class="menu-toggle" id="menuToggle">
      <span>☰</span>
      <span>Filters</span>
    </button>
    <div class="filter-dropdown" id="filterDropdown">
      <button class="filter-dropdown-btn" id="dropdownBtn">
        <span id="selectedFilter">All Photos</span>
        <span class="dropdown-arrow">▼</span>
      </button>
      <div class="filter-dropdown-menu">
        <button class="filter-btn active" data-filter="all">
          All Photos
        </button>
        <button class="filter-btn" data-filter="recent">
          📅 Recently Uploaded
        </button>
        <button class="filter-btn" data-filter="camera">
          📷 Camera Uploads
        </button>
        <button class="filter-btn" data-filter="documents">
          📄 Documents
        </button>
        <button class="filter-btn" data-filter="albums">📁 Albums</button>
      </div>
    </div>
  </div>

  <!-- Gallery Container -->
  <div class="gallery-container">
    <div class="date-group">
      <div class="date-header">November 2025</div>
      <div id="gallery" class="justified-gallery">
        <div class="loading">Loading images</div>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">×</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev">‹</button>
    <div class="lightbox-content">
      <img src="" alt="Full size image" class="lightbox-image" id="lightbox-image" />
    </div>
    <button class="lightbox-nav lightbox-next" id="lightbox-next">›</button>
    <div class="lightbox-counter" id="lightbox-counter">1 / 24</div>
  </div>

  <script src="script.js"></script>
</body>

</html>
